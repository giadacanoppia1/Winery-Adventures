name: ci

# il workflow parte quando fai push o apri una pull request.
# vedi subito se tutto funziona e puoi bloccare l'unione del codice se ci sono errori.
on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

# se fai un nuovo commit sullo stesso branch, questo ferma i test vecchi
# ancora in corso. così non sprechi tempo e risorse del server.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint e formattazione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: installa ruff
        run: pip install ruff

      - name: controlla la formattazione
        run: ruff format --check .

      - name: controlla lo stile e gli errori statici
        run: ruff check .

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # se una versione fallisce, le altre continuano a girare.
      # così capisci subito se l'errore c'è sempre o dipende solo da una versione di python.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: installa il progetto e le dipendenze di sviluppo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: esegui i test
        # questa riga dice al sistema di non cercare le password per connettersi a wandb.
        env:
          WANDB_MODE: offline
        run: pytest

  coverage:
    name: copertura dei test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: installa il progetto e le dipendenze di sviluppo
        run: pip install -e ".[dev]"

      - name: misura la copertura
        # numba di solito trasforma il codice in linguaggio macchina per renderlo veloce,
        # ma lo strumento per la copertura non riesce a leggerlo.
        # spegnendolo, il codice gira come python normale e possiamo misurare cosa è stato testato.
        # escludiamo solo il test che controlla numba stesso, perché lo abbiamo già provato prima.
        env:
          WANDB_MODE: offline
          NUMBA_DISABLE_JIT: "1"
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml \
            --deselect tests/unit/test_computations.py::test_is_function_numba

      - name: pubblica il report di copertura come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  smoke:
    name: esecuzione end-to-end sui dati di esempio
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: installa il progetto
        run: pip install -e ".[dev]"

      - name: esegui la pipeline sui dati di esempio
        env:
          WANDB_MODE: offline
        run: |
          python -m winery_adventures.main \
            --input-csv data/sensors_sample.tsv \
            --tank-info-csv data/tank_info_sample.tsv \
            --output-csv results/results.csv

      - name: verifica che il file dei risultati sia stato prodotto
        run: test -s results/results.csv
