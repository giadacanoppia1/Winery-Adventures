[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winery-adventures"
version = "1.0.0"
description = "Pipeline di analisi dei dati dei sensori di una cantina di fermentazione."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "numba>=0.59",
    "numpy>=1.26",
    "joblib>=1.3",
    "wandb>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "tqdm>=4.66",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=3.0",
]

[project.scripts]
winery-adventures = "winery_adventures.main:main"

[tool.setuptools.packages.find]
include = ["winery_adventures*"]

# ----------------------------------------------------------------------
# Formattazione e linting: ruff sostituisce black + flake8 + isort
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: errori PEP 8
    "W",   # pycodestyle: warning
    "F",   # pyflakes: variabili e import inutilizzati
    "I",   # isort: ordinamento degli import
    "N",   # pep8-naming: convenzioni sui nomi
    "D",   # pydocstyle: presenza e forma delle docstring
    "UP",  # pyupgrade: sintassi moderna
    "B",   # flake8-bugbear: bug latenti
    "SIM", # flake8-simplify
]
ignore = [
    "D203",  # incompatibile con D211 (una sola delle due va scelta)
    "D213",  # incompatibile con D212
]

[tool.ruff.lint.per-file-ignores]
# I test documentano se stessi con nomi espliciti: docstring non obbligatorie.
"tests/*" = ["D100", "D103", "D205", "D212", "D415", "N806", "I001"]
# Nomi di variabili conformi alla specifica del progetto (pH_vals, ...).
"winery_adventures/computations.py" = ["N803"]
# File forniti dal committente: non li modifichiamo, quindi non li valutiamo
# con le nostre regole di stile. Ogni modifica renderebbe piu' difficile
# ricevere aggiornamenti della consegna.
"data_generator.py" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ----------------------------------------------------------------------
# Test
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: test più lenti, tipicamente di accettazione end-to-end.",
]

[tool.coverage.run]
source = ["winery_adventures"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
