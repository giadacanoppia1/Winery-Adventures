[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winery-adventures"
version = "1.0.0"
description = "pipeline di analisi dei dati dei sensori di una cantina di fermentazione."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "numba>=0.59",
    "numpy>=1.26",
    "joblib>=1.3",
    "wandb>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "tqdm>=4.66",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=3.0",
]

[project.scripts]
winery-adventures = "winery_adventures.main:main"

[tool.setuptools.packages.find]
include = ["winery_adventures*"]

# ----------------------------------------------------------------------
# formattazione e controllo del codice: ruff fa il lavoro di black, 
# flake8 e isort tutti insiema in un solo strumento velocissimo.
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: trova errori di stile standard (le regole pep 8)
    "W",   # pycodestyle: avvisi e piccoli suggerimenti sul codice
    "F",   # pyflakes: scova variabili create e pacchetti importati ma mai usati
    "I",   # isort: mette in ordine alfabetico e raggruppa li import all'inizio
    "N",   # pep8-naming: controlla che i nomi di funzioni e variabili siano corretti
    "D",   # pydocstyle: verifica che le spiegazioni delle funzioni (docstring) ci siano
    "UP",  # pyupgrade: suggerisce come usare il python più moderno
    "B",   # flake8-bugbear: cerca errori strani e possibili bug nascosti
    "SIM", # flake8-simplify: ti aiuta a scrivere lo stesso codice in modo più semplice
]
ignore = [
    "D203",  # in conflitto con la regola d211 (ne possiamo accendere solo una)
    "D213",  # in conflitto con la regola d212
]

[tool.ruff.lint.per-file-ignores]
# nei test diamo nomi molto lunghi ed espliciti alle funzioni per spiegare 
# cosa stiamo testando. per questo motivo le docstring non sono obbligatorie qui.
"tests/*" = ["D100", "D103", "D205", "D212", "D415", "N806", "I001"]

# teniamo i nomi delle variabili esattamente come richiesti dalla specifica 
# del progetto per evitare confusione (ad esempio permettiamo "pH_vals").
"winery_adventures/computations.py" = ["N803"]

# file esterno fornito per il progetto: non lo abbiamo scritto noi e non lo 
# modifichiamo. disattiviamo tutti i controlli (ALL) su questo fila, 
# altrimenti se chi ce l'ha dato lo aggiorna, faremmo fatica a sostituirlo.
"data_generator.py" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ----------------------------------------------------------------------
# configurazione dei test
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: test che ci mettono tanto tempo, di solito quelli che provano tutto il sistema (end-to-end).",
]

[tool.coverage.run]
source = ["winery_adventures"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]